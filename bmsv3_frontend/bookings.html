<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockMySeat - My Bookings</title>
    
    <!-- Link all necessary CSS files -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global-header.css">
    <link rel="stylesheet" href="styles/main-layout.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/bookings.css">
    <link rel="stylesheet" href="styles/guest-prompt.css">
    <!-- Your Font Awesome Kit Script -->
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
</head>
<body class="day-mode">

    <!-- 1. Global Header -->
    <header class="global-header">
        <div class="header-logo">
            <!-- Logo is a div, not a link, as requested -->
            <div class="logo-text">BlockMySeat</div>
        </div>
        <div class="search-bar">
            <div class="search-container">
                <input type="text" placeholder="Search...">
                <span class="search-icon custom-icon"></span>
            </div>
        </div>
        <div class="header-right">
            <nav class="global-nav">
                <a href="movies.html">Movies<i class="icon icon-movies"></i></a>
                <a href="venues.html">Venues<i class="icon icon-venues"></i></a>
            </nav>
            <div class="header-profile">
                <img src="images/user-avatar.png" alt="User Avatar">
            </div>
        </div>
    </header>

    <!-- 2. Main Application Container -->
    <div class="app-container">
        
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <p class="nav-title">MENU</p>
                <ul>
                    <li><a href="bookings.html" class="nav-link active"><i class="icon icon-home"></i> Home</a></li>
                    <li><a href="bookings.html/top-rated" class="nav-link"><i class="icon icon-top-rated"></i> Top Rated</a></li>
                </ul>
            </nav>
            <div class="sidebar-general">
                <p class="nav-title">GENERAL</p>
                
                <ul>
                    <!-- This now has its own unique class and is NOT a nav-link -->
                    <li class="sidebar-toggle-item">
                        <span><i class="icon icon-toggle"></i> Dark Mode</span>
                        <div class="theme-toggle" id="sidebar-theme-toggle">
                            <div class="toggle-indicator"></div>
                        </div>
                    </li>
                    <!-- The other links remain as they were -->
                    <li><a href="settings.html" class="nav-link"><i class="icon icon-settings"></i> Settings</a></li>
                    <li><a href="#" id="logout-button" class="nav-link"><i class="icon icon-logout"></i> Log out</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <section class="booking-section">
                <h2 class="booking-section-title">Upcoming Bookings</h2>
                <div id="upcoming-bookings-list" class="booking-list">

                </div>
            </section>
            <section class="booking-section">
                <h2 class="booking-section-title">Previous Bookings</h2>
                <div id="previous-bookings-list" class="booking-list">
                </div>
            </section>
        </main>
    </div>

    <!-- Template for a single booking card (hidden) -->
    <div class="booking-card" id="booking-card-template" style="display: none;">
        <img src="" alt="Movie Poster" class="booking-poster">
        <div class="booking-details">
            <h3 class="booking-movie-title">Movie Title</h3>
            <p class="booking-venue-name">Venue Name</p>
            <div class="booking-info">
                <span class="booking-date"></span>
                <span class="booking-seat-count"></span>
            </div>
        </div>
    </div>

    <div id="logout-prompt-overlay" class="prompt-overlay hidden">
        <div id="logout-prompt" class="prompt-box">
            <h3>Are you sure you want to log out?</h3>
            <div class="prompt-buttons">
                <button id="cancel-logout-btn">Cancel</button>
                <button id="confirm-logout-btn">Log Out</button>
            </div>
        </div>

    <script src="bookings.js"></script>
    
</body>
</html>
